name: impute5
channels:
  - dranew
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - bcftools>=1.18
  - htslib>=1.18
  - plink=1.90b6.21
  - plink2=2.00a5
  - shapeit=2.r904
  # For 23andMe_imputer.R itself: GenoUtils' own runtime deps are just
  # data.table/base R, but a per-env install (r-remotes) is needed too - this
  # pipeline never shares GenoUtils installs across conda envs (see the
  # install_genoutils_xwing/_sbayesrc/_bridgeprs rules in dependencies.smk).
  - r-base=4.2.3
  - r-data.table=1.14.8
  - r-optparse=1.7.3
  - r-remotes=2.4.2.1
